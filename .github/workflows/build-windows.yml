name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Build the Windows Python worker
        run: npm run engines:python:win

      - name: Stage Windows Poppler binaries
        run: npm run engines:poppler:win

      - name: Build the Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Format-Conversion-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
